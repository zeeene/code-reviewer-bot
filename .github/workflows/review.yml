name: lgtm-9000
on:
  pull_request:
    types: [opened, ready_for_review] # no synchronize — reviews aren't repeated per push
  issue_comment:
    types: [created]
concurrency:
  group: ai-review-${{ github.event.pull_request.number || github.event.issue.number }}
  cancel-in-progress: true
permissions:
  contents: read
  pull-requests: write
jobs:
  review:
    if: >
      (github.event_name == 'pull_request' &&
       github.event.pull_request.draft == false &&
       !contains(github.event.pull_request.labels.*.name, 'no-ai-review')) ||
      (github.event_name == 'issue_comment' &&
       github.event.issue.pull_request &&
       !contains(github.event.issue.labels.*.name, 'no-ai-review') &&
       (contains(github.event.comment.body, '/review') ||
        contains(github.event.comment.body, '/lgtm9000')))
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # issue_comment events run against the default branch — check out the PR head instead
          ref: ${{ github.event_name == 'issue_comment' && format('refs/pull/{0}/head', github.event.issue.number) || '' }}
      - uses: ./
        with:
          openrouter-api-key: ${{ secrets.OPENROUTER_API_KEY }}
