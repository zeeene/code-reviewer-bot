name: LGTM-9000
description: AI code review on pull requests via OpenRouter. I'm sorry Dave, I'm afraid I can't approve this.
inputs:
  openrouter-api-key:
    description: OpenRouter API key
    required: true
  model:
    description: OpenRouter model id
    default: qwen/qwen3.7-flash
  extra-instructions:
    description: Optional project-specific review guidance appended to the general system prompt
    default: ""
  github-token:
    description: Token used to fetch the diff and post the review
    default: ${{ github.token }}
runs:
  using: composite
  steps:
    - uses: actions/setup-node@v4
      with:
        node-version: 22
    - run: npm ci
      shell: bash
      working-directory: ${{ github.action_path }}
    - run: npm run --silent review
      shell: bash
      working-directory: ${{ github.action_path }}
      env:
        OPENROUTER_API_KEY: ${{ inputs.openrouter-api-key }}
        MODEL: ${{ inputs.model }}
        EXTRA_INSTRUCTIONS: ${{ inputs.extra-instructions }}
        GITHUB_TOKEN: ${{ inputs.github-token }}
